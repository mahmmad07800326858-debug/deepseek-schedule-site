<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الدروس · مشاركة الباركود ومشاركة الموقع</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a6fb5;
            --dev: #f59e0b;
            --bg: #eef2f7;
            --card-bg: #ffffff;
            --shadow: 0 4px 16px rgba(0,0,0,0.08);
            --radius: 14px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Cairo',sans-serif; background:var(--bg); color:#1e293b;
            min-height:100vh; display:flex; justify-content:center; padding:20px 10px 60px;
        }
        .main-container { width:100%; max-width:1200px; display:flex; flex-direction:column; gap:20px; }
        .toolbar {
            display:flex; align-items:center; justify-content:center; gap:10px;
            background:var(--card-bg); padding:10px 16px; border-radius:var(--radius);
            box-shadow:var(--shadow); position:sticky; top:16px; z-index:100; flex-wrap:wrap;
        }
        .btn { display:flex; align-items:center; gap:6px; padding:10px 16px; border-radius:50px;
            font-family:'Cairo'; font-size:0.9rem; font-weight:600; cursor:pointer; border:1.5px solid #cbd5e1;
            background:#fff; color:#1e293b; transition:0.2s; white-space:nowrap; position:relative; }
        .btn:hover { background:#f1f5f9; }
        .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn.primary:hover { background:#14527a; }
        .dev-indicator {
            display:none; width:10px; height:10px; background:var(--dev); border-radius:50%;
            position:absolute; top:5px; right:5px; border:2px solid white;
        }
        .dev-indicator.active { display:block; }
        .search-wrapper { flex:1; min-width:200px; max-width:500px; position:relative; }
        .search-input { width:100%; padding:10px 16px 10px 44px; border:1.5px solid #cbd5e1; border-radius:50px;
            font-family:'Cairo'; font-size:0.95rem; background:#f8fafc; outline:none; }
        .dropdown { position:absolute; top:calc(100% + 8px); left:0; background:#fff; border-radius:var(--radius);
            box-shadow:0 12px 32px rgba(0,0,0,0.15); padding:8px; min-width:280px; display:none; z-index:200;
            border:1px solid #cbd5e1; }
        .dropdown.show { display:block; }
        .dropdown-item { display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px; border:none;
            background:transparent; cursor:pointer; font-family:'Cairo'; font-size:0.9rem; text-align:right;
            border-radius:8px; transition:0.15s; }
        .dropdown-item:hover { background:#f1f5f9; }
        .overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); z-index:500;
            display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
        .overlay.show { display:flex; }
        .dialog { background:#fff; border-radius:var(--radius); padding:28px 24px; width:400px; max-width:92vw; }
        .dialog input { width:100%; padding:12px; border:2px solid #cbd5e1; border-radius:50px; font-family:'Cairo';
            font-size:1rem; text-align:center; direction:ltr; margin-bottom:12px; }
        .toggle-switch { position:relative; width:52px; height:28px; display:inline-block; }
        .toggle-switch input { opacity:0; width:0; height:0; }
        .toggle-slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#cbd5e1;
            border-radius:28px; transition:0.3s; }
        .toggle-slider::before { content:''; position:absolute; height:22px; width:22px; left:3px; bottom:3px;
            background:white; border-radius:50%; transition:0.3s; }
        .toggle-switch input:checked+.toggle-slider { background:var(--dev); }
        .toggle-switch input:checked+.toggle-slider::before { transform:translateX(24px); }
        .tables-container { display:flex; flex-direction:column; gap:20px; }
        .schedule-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
            padding:24px 20px; position:relative; page-break-inside:avoid; }
        .school-name { text-align:center; font-size:1.5rem; font-weight:700; margin-bottom:4px; }
        .date { text-align:center; font-size:0.9rem; color:#64748b; margin-bottom:16px; }
        .table-wrap { border:2px solid #d1d5db; border-radius:var(--radius); overflow:auto; }
        .schedule-table { width:100%; border-collapse:collapse; font-size:0.9rem; min-width:750px; table-layout:fixed; }
        .schedule-table th, .schedule-table td {
            border:2px solid #cbd5e1; padding:10px 6px; text-align:center; vertical-align:middle;
        }
        .schedule-table thead th { background:var(--primary); color:#fff; font-weight:700; }
        .schedule-table tbody td { background:#fff; }
        .schedule-table tbody tr:nth-child(even) td { background:#f8fafc; }
        .schedule-table tbody tr:hover td { background:#e8f4fd; }
        [contenteditable="true"] { background:#fffdf5 !important; border:2px dashed #fcd34d !important; cursor:text; }
        .dev-controls { display:none; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
        .dev-controls.active { display:flex; }
        .btn-dev { padding:9px 18px; border-radius:50px; border:2px solid var(--dev); background:#fff;
            cursor:pointer; font-family:'Cairo'; font-weight:600; color:#92400e; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(120px);
            background:#1e293b; color:#fff; padding:12px 24px; border-radius:50px; font-family:'Cairo';
            font-weight:600; z-index:999; pointer-events:none; transition:0.35s; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .qr-container { text-align:center; }
        #qrcodeCanvas { display:inline-block; margin:10px auto; }
        .btn-close { background:#f1f5f9; padding:10px 24px; border-radius:50px; border:none; cursor:pointer; font-family:'Cairo'; font-weight:600; margin-top:12px; }
        @media print {
            .toolbar, .dev-controls, .dropdown, .overlay, .toast, .search-wrapper { display:none !important; }
            .schedule-card { box-shadow:none; border:none; padding:5mm; }
            .table-wrap { border:1px solid #000; }
            .schedule-table { min-width:100%; font-size:0.8rem; }
            @page { size: A4 landscape; margin: 10mm; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="toolbar" id="toolbar" style="position:relative;">
            <button class="btn" id="btnSettings" style="position:relative;">
                <span>⚙️</span><span class="btn-text">الإعدادات</span>
                <span class="dev-indicator" id="devIndicator"></span>
            </button>
            <div class="search-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث في الجداول...">
            </div>
            <button class="btn primary" id="btnShare" style="position:relative;"><span>📤</span><span class="btn-text">مشاركة</span></button>
            <div class="dropdown" id="shareDropdown">
                <button class="dropdown-item" data-action="share-site" style="color:#2563eb;font-weight:700;"><span>🔗</span> مشاركة الموقع</button>
                <button class="dropdown-item" data-action="qr-code" style="color:#8b5cf6;font-weight:700;"><span>📱</span> مشاركة الباركود</button>
                <button class="dropdown-item" data-action="copy-link" style="color:#059669;"><span>📋</span> نسخ رابط الصفحة</button>
                <div style="height:1px; background:#eee; margin:4px;"></div>
                <button class="dropdown-item" data-action="print"><span>🖨️</span> طباعة</button>
                <button class="dropdown-item" data-action="pdf"><span>📑</span> حفظ PDF</button>
                <button class="dropdown-item" data-action="word"><span>📄</span> تصدير Word</button>
                <button class="dropdown-item" data-action="image"><span>🖼️</span> تصدير صورة</button>
            </div>
        </div>
        <div class="tables-container" id="tablesContainer"></div>
        <div class="dev-controls" id="devControls">
            <button class="btn-dev" id="btnAddRow">➕ إضافة حصة</button>
            <button class="btn-dev" id="btnRemoveRow">➖ حذف آخر حصة</button>
            <button class="btn-dev" id="btnResetTable">🔄 إعادة تعيين</button>
        </div>
    </div>
    <div class="overlay" id="passwordOverlay">
        <div class="dialog">
            <h3>🔐 كلمة المرور</h3>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" maxlength="20" autocomplete="off">
            <p id="passwordError" style="color:#ef4444;display:none;">❌ كلمة مرور خاطئة</p>
            <div style="display:flex;gap:10px;margin-top:16px;justify-content:center;">
                <button id="btnPasswordCancel" style="padding:10px 20px;border-radius:50px;border:none;background:#f1f5f9;cursor:pointer;">إلغاء</button>
                <button id="btnPasswordSubmit" style="padding:10px 20px;border-radius:50px;border:none;background:var(--primary);color:#fff;cursor:pointer;">دخول</button>
            </div>
        </div>
    </div>
    <div class="overlay" id="settingsOverlay">
        <div class="dialog" style="width:560px;max-height:85vh;overflow-y:auto;padding:24px;">
            <h3>⚙️ الإعدادات</h3>
            <div style="margin:16px 0; display:flex; align-items:center; justify-content:space-between;">
                <span style="font-weight:600;">🛠️ وضع المطور</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="devModeToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div style="margin:16px 0; display:flex; align-items:center; justify-content:space-between;">
                <span style="font-weight:600;">📋 عرض كل الجداول المحددة</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="showAllToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <input type="text" id="newRecordName" placeholder="اسم السجل الجديد" style="width:100%;padding:10px;border-radius:50px;border:1px solid #ccc; margin:10px 0;">
            <button id="btnSaveRecord" style="background:#10b981;color:#fff;padding:10px;border:none;border-radius:50px;width:100%;cursor:pointer;font-family:'Cairo';font-weight:600;">💾 حفظ الجدول الحالي كسجل</button>
            <h4 style="margin-top:20px;">📋 السجلات المحفوظة</h4>
            <div id="recordsList" style="max-height:300px;overflow-y:auto;"></div>
            <button id="btnCloseSettings" style="background:#f1f5f9;padding:10px;border:none;border-radius:50px;width:100%;margin-top:16px;cursor:pointer;font-family:'Cairo';font-weight:600;">✕ إغلاق</button>
        </div>
    </div>
    <div class="overlay" id="qrOverlay">
        <div class="dialog qr-container">
            <h3>📱 باركود الجدول</h3>
            <p>امسح الكود بكاميرا الهاتف للدخول</p>
            <div id="qrcodeCanvas"></div>
            <p style="font-size:0.8rem;color:#64748b;margin-top:8px;">الرابط: <span id="qrUrlDisplay" style="direction:ltr;display:inline-block;"></span></p>
            <button class="btn-close" id="btnCloseQr">إغلاق</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        (function() {
            const PASSWORD = '20262026';
            const STORAGE = 'schedule_db';
            let isDevMode = false;
            let showAll = true;
            let records = [];
            let activeId = null;
            const defaultHTML = `<table class="schedule-table"><colgroup><col style="width:80px;"><col style="width:200px;"><col style="width:130px;"><col style="width:140px;"><col style="width:160px;"></colgroup><thead><tr><th>رقم</th><th>المادة</th><th>الساعة</th><th>الفصل</th><th>الملاحظات</th></tr></thead><tbody><tr><td>١</td><td>اللغة العربية</td><td>٨:٣٠</td><td>الفصل ١</td><td>—</td></tr><tr><td>٢</td><td>الرياضيات</td><td>٩:٣٠</td><td>الفصل ١</td><td>—</td></tr><tr><td>٣</td><td>العلوم</td><td>١٠:٣٠</td><td>الفصل ١</td><td>—</td></tr></tbody></table>`;
            
            function loadRecords() {
                try { records = JSON.parse(localStorage.getItem(STORAGE)) || []; } catch { records = []; }
                if (!records.length) {
                    records.push({ id:'draft', name:'المسودة', html:defaultHTML, showOnHome:true, public:true, school:'مدرسة النور', date:'' });
                }
                saveRecords();
            }
            function saveRecords() { localStorage.setItem(STORAGE, JSON.stringify(records)); }
            loadRecords();

            function render() {
                const container = document.getElementById('tablesContainer');
                container.innerHTML = '';
                let toShow = showAll ? records.filter(r => r.showOnHome) : [records.find(r => r.id === activeId)].filter(Boolean);
                if (!toShow.length && records.length) toShow = [records[0]];

                toShow.forEach(rec => {
                    const card = document.createElement('div');
                    card.className = 'schedule-card';
                    card.dataset.recordId = rec.id;
                    const dateStr = rec.date || new Date().toLocaleDateString('ar-EG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
                    card.innerHTML = `
                        <div class="school-name" contenteditable="${isDevMode}">${rec.school || 'مدرسة النور'}</div>
                        <div class="date" contenteditable="${isDevMode}">${dateStr}</div>
                        <div class="table-wrap">${rec.html || defaultHTML}</div>
                    `;
                    container.appendChild(card);
                });

                document.querySelectorAll('.schedule-table td, .schedule-table th').forEach(el => {
                    if (!isDevMode) {
                        el.removeAttribute('contenteditable');
                        el.style.cursor = 'default';
                    } else {
                        el.contentEditable = 'true';
                        el.style.cursor = 'text';
                    }
                });
                document.getElementById('devIndicator').classList.toggle('active', isDevMode);
            }

            function setDevMode(val) {
                isDevMode = val;
                document.getElementById('devModeToggle').checked = val;
                document.getElementById('devControls').classList.toggle('active', val);
                render();
                showToast(val ? '🛠️ وضع المطور مفعّل' : '🔒 القفل مُحكم');
            }

            function askPasswordThen(callback) {
                const overlay = document.getElementById('passwordOverlay');
                const input = document.getElementById('passwordInput');
                const error = document.getElementById('passwordError');
                overlay.classList.add('show');
                input.value = '';
                error.style.display = 'none';
                input.focus();
                document.getElementById('btnPasswordSubmit').onclick = () => {
                    if (input.value === PASSWORD) {
                        overlay.classList.remove('show');
                        callback();
                    } else {
                        error.style.display = 'block';
                        input.value = '';
                    }
                };
                document.getElementById('btnPasswordCancel').onclick = () => overlay.classList.remove('show');
            }

            document.getElementById('btnSettings').addEventListener('click', () => {
                askPasswordThen(() => {
                    document.getElementById('settingsOverlay').classList.add('show');
                    document.getElementById('showAllToggle').checked = showAll;
                    document.getElementById('devModeToggle').checked = isDevMode;
                    refreshRecordList();
                });
            });

            document.getElementById('devModeToggle').addEventListener('change', function() {
                setDevMode(this.checked);
            });

            document.getElementById('btnCloseSettings').addEventListener('click', () => {
                document.getElementById('settingsOverlay').classList.remove('show');
            });

            document.getElementById('showAllToggle').addEventListener('change', function() {
                showAll = this.checked;
                localStorage.setItem('showAll', showAll.toString());
                render();
            });

            document.getElementById('btnSaveRecord').addEventListener('click', () => {
                const name = document.getElementById('newRecordName').value.trim() || 'جدول ' + new Date().toLocaleDateString('ar-SA');
                const firstTable = document.querySelector('.table-wrap');
                if (!firstTable) return;
                const record = {
                    id: Date.now().toString(),
                    name: name,
                    html: firstTable.innerHTML,
                    school: document.querySelector('.school-name')?.textContent || '',
                    date: document.querySelector('.date')?.textContent || '',
                    showOnHome: true,
                    public: true,
                };
                records.unshift(record);
                saveRecords();
                render();
                refreshRecordList();
                showToast('💾 تم الحفظ');
            });

            function refreshRecordList() {
                const list = document.getElementById('recordsList');
                list.innerHTML = records.map(r => `
                    <div style="display:flex;align-items:center;gap:8px;padding:8px;background:#fff;border:1px solid #ccc;border-radius:8px;margin-bottom:4px;">
                        <span style="flex:1;"><strong>${r.name}</strong><br><small>${r.public ? '🟢 عام' : '🟡 خاص'} ${r.showOnHome ? '📌 معروض' : 'ـ مخفي'}</small></span>
                        <button onclick="window._loadRecord('${r.id}')" style="padding:4px 8px;border:none;background:#e3f2fd;cursor:pointer;border-radius:4px;">📥 عرض</button>
                        <button onclick="window._togglePublic('${r.id}')" style="padding:4px 8px;border:none;background:#fff3e0;cursor:pointer;border-radius:4px;">${r.public ? '🔒' : '🌐'}</button>
                        <button onclick="window._toggleHome('${r.id}')" style="padding:4px 8px;border:none;background:#f3e5f5;cursor:pointer;border-radius:4px;">${r.showOnHome ? '👁️' : '🙈'}</button>
                        <button onclick="window._deleteRecord('${r.id}')" style="padding:4px 8px;border:none;background:#ffebee;cursor:pointer;border-radius:4px;">🗑️</button>
                    </div>`).join('');
            }

            window._loadRecord = (id) => { activeId = id; showAll = false; document.getElementById('showAllToggle').checked = false; localStorage.setItem('showAll', 'false'); render(); document.getElementById('settingsOverlay').classList.remove('show'); };
            window._togglePublic = (id) => { const rec = records.find(r => r.id === id); if (rec) { rec.public = !rec.public; saveRecords(); refreshRecordList(); } };
            window._toggleHome = (id) => { const rec = records.find(r => r.id === id); if (rec) { rec.showOnHome = !rec.showOnHome; saveRecords(); refreshRecordList(); render(); } };
            window._deleteRecord = (id) => { if (!confirm('حذف السجل؟')) return; records = records.filter(r => r.id !== id); saveRecords(); render(); refreshRecordList(); };

            function getPageUrl() { return window.location.href.split('#')[0]; }
            function copyToClipboard(text) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => showToast('🔗 تم نسخ الرابط'));
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('🔗 تم النسخ');
                }
            }
            function nativeShare(url) {
                if (navigator.share) {
                    navigator.share({ title: 'جدول الدروس', text: 'تفضل بالإطلاع على جدول الدروس', url: url }).catch(() => {});
                } else {
                    copyToClipboard(url);
                    showToast('📋 الرابط جاهز، شاركه يدوياً');
                }
            }
            function showQRCode() {
                const url = getPageUrl();
                const overlay = document.getElementById('qrOverlay');
                document.getElementById('qrUrlDisplay').textContent = url;
                overlay.classList.add('show');
                const container = document.getElementById('qrcodeCanvas');
                container.innerHTML = '';
                new QRCode(container, { text: url, width: 200, height: 200, colorDark: '#1a6fb5', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            }
            function exportWord() {
                const cards = document.querySelectorAll('.schedule-card');
                let html = '';
                cards.forEach(card => {
                    const school = card.querySelector('.school-name')?.textContent || '';
                    const date = card.querySelector('.date')?.textContent || '';
                    const table = card.querySelector('.table-wrap')?.innerHTML || '';
                    html += `<div style="margin-bottom:20px;"><h2 style="text-align:center;">${school}</h2><p style="text-align:center;">${date}</p>${table}</div>`;
                });
                const fullHtml = `<html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:'Cairo',sans-serif;direction:rtl;padding:20px;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #999;padding:8px;text-align:center;} th{background:#1a6fb5;color:#fff;}</style></head><body>${html}</body></html>`;
                const blob = new Blob(['\ufeff' + fullHtml], { type: 'application/msword' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'جدول_الدروس.doc';
                a.click();
                showToast('📄 تم التصدير إلى Word');
            }

            document.getElementById('btnShare').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('shareDropdown').classList.toggle('show'); });
            document.getElementById('shareDropdown').addEventListener('click', e => {
                const action = e.target.closest('.dropdown-item')?.dataset.action;
                if (!action) return;
                e.preventDefault();
                document.getElementById('shareDropdown').classList.remove('show');
                if (action === 'share-site') nativeShare(getPageUrl());
                else if (action === 'qr-code') showQRCode();
                else if (action === 'copy-link') copyToClipboard(getPageUrl());
                else if (action === 'print') window.print();
                else if (action === 'pdf') { showToast('📑 استخدم حفظ كـ PDF من نافذة الطباعة'); window.print(); }
                else if (action === 'word') exportWord();
                else if (action === 'image') html2canvas(document.querySelector('.schedule-card') || document.body, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => { const a = document.createElement('a'); a.download = 'جدول_الدروس.png'; a.href = canvas.toDataURL(); a.click(); showToast('🖼️ تم حفظ الصورة'); }).catch(() => showToast('⚠️ خطأ في التصدير'));
            });

            document.getElementById('btnCloseQr').addEventListener('click', () => document.getElementById('qrOverlay').classList.remove('show'));
            document.addEventListener('click', (e) => { if (!e.target.closest('#shareDropdown') && !e.target.closest('#btnShare')) document.getElementById('shareDropdown').classList.remove('show'); });

            document.getElementById('btnAddRow').addEventListener('click', () => {
                if (!isDevMode) return;
                const tbody = document.querySelector('.schedule-table tbody');
                if (!tbody) return;
                const rowCount = tbody.children.length + 1;
                const colCount = tbody.querySelector('tr')?.children.length || 5;
                const newRow = document.createElement('tr');
                for (let i = 0; i < colCount; i++) {
                    const td = document.createElement('td');
                    td.contentEditable = 'true';
                    td.textContent = i === 0 ? toArabic(rowCount.toString()) : (i === 2 ? '--:--' : '—');
                    newRow.appendChild(td);
                }
                tbody.appendChild(newRow);
                saveCurrentTable();
            });
            document.getElementById('btnRemoveRow').addEventListener('click', () => {
                if (!isDevMode) return;
                const tbody = document.querySelector('.schedule-table tbody');
                if (tbody && tbody.children.length > 2) { tbody.lastChild.remove(); saveCurrentTable(); }
            });
            document.getElementById('btnResetTable').addEventListener('click', () => {
                if (!isDevMode) return;
                if (confirm('إعادة تعيين الجدول؟')) {
                    const table = document.querySelector('.schedule-table');
                    if (table) table.parentElement.innerHTML = defaultHTML;
                    saveCurrentTable();
                    render();
                }
            });

            function saveCurrentTable() {
                if (!isDevMode) return;
                const card = document.querySelector('.schedule-card');
                if (!card) return;
                const recordId = card.dataset.recordId;
                const rec = records.find(r => r.id === recordId);
                if (rec) { rec.html = card.querySelector('.table-wrap')?.innerHTML || rec.html; rec.school = card.querySelector('.school-name')?.textContent || rec.school; rec.date = card.querySelector('.date')?.textContent || rec.date; saveRecords(); }
            }

            document.addEventListener('input', e => { if (!isDevMode) return; if (e.target.closest('.schedule-table') || e.target.classList.contains('school-name') || e.target.classList.contains('date')) saveCurrentTable(); });
            document.addEventListener('click', e => { if (!isDevMode && (e.target.isContentEditable || e.target.closest('[contenteditable="true"]'))) { e.preventDefault(); showToast('🔒 القفل مفعّل'); } }, true);

            function toArabic(numStr) { const map = { '0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩' }; return numStr.replace(/[0-9]/g, d => map[d] || d); }
            function showToast(msg, dur = 2200) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), dur); }

            showAll = localStorage.getItem('showAll') !== 'false';
            document.getElementById('showAllToggle').checked = showAll;
            render();

            document.addEventListener('keydown', e => {
                if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
                if (e.key === 'Escape') {
                    document.getElementById('passwordOverlay').classList.remove('show');
                    document.getElementById('settingsOverlay').classList.remove('show');
                    document.getElementById('qrOverlay').classList.remove('show');
                }
            });
        })();
    </script>
</body>
</html>
